<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拆书详情页</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 20px;position:sticky;top:0;z-index:50;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;font-weight:700}
header .sub{font-size:12px;color:#6b7280}

/* ---- 全局筛选器 ---- */
.gfilter{background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 20px;position:sticky;top:52px;z-index:49;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gfilter label{font-size:12px;color:#374151;white-space:nowrap}
.gfilter .numin{width:54px;padding:4px 6px;font-size:13px;border:1px solid #d1d5db;border-radius:6px;outline:none;text-align:center;background:#fff}
.gfilter .numin:focus{border-color:#4f7cff}
/* 章节范围轴 */
.rangeaxis{flex:1;min-width:260px;position:relative;height:38px;user-select:none}
.ra-track{position:absolute;left:10px;right:10px;top:50%;transform:translateY(-50%);height:6px;background:#e5e7eb;border-radius:3px}
.ra-tick{position:absolute;top:50%;transform:translate(-50%,-50%);width:2px;height:10px;background:#cbd5e1}
.ra-range{position:absolute;top:6px;bottom:6px;background:rgba(79,124,255,.14);border-radius:3px;pointer-events:none}
.ra-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #4f7cff;cursor:ew-resize;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.ra-thumb.end{border-color:#f59e0b}
.ra-thumb.dragging{transform:translate(-50%,-50%) scale(1.2)}
.ra-label{position:absolute;top:-20px;transform:translateX(-50%);font-size:11px;font-weight:600;color:#4f7cff;white-space:nowrap;pointer-events:none}
.ra-label.end{color:#f59e0b}
.gfilter .stat{font-size:12px;color:#6b7280;margin-left:auto}
.gfilter .stat b{color:#4f7cff}

/* ---- Tab ---- */
.tabs{display:flex;gap:6px;padding:10px 20px 0}
.tab{padding:8px 22px;border-radius:8px 8px 0 0;font-size:14px;cursor:pointer;border:1px solid transparent;background:#e5e7eb;color:#374151}
.tab.active{background:#fff;border-color:#e5e7eb;border-bottom-color:#fff;color:#4f7cff;font-weight:700}
main{padding:10px 20px 40px}
section.tabpane{display:none}
section.tabpane.active{display:block}

/* ---- 剧情: 时间轴 ---- */
.tlwrap{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px 16px 10px;margin-bottom:14px;overflow-x:auto}
.tl{position:relative;height:96px;min-width:1200px;margin:0 10px}
.tl .line{position:absolute;left:0;right:0;top:40px;height:3px;background:#e5e7eb;border-radius:2px}
.tl .prog{position:absolute;left:0;top:40px;height:3px;background:#4f7cff;border-radius:2px;width:0;transition:width .2s}
.tl .node{position:absolute;top:24px;transform:translateX(-50%);text-align:center;cursor:pointer;width:34px}
.tl .node .dot{width:12px;height:12px;border-radius:50%;background:#d1d5db;margin:0 auto;border:2px solid #fff;box-shadow:0 0 0 1px #d1d5db}
.tl .node.hot .dot{background:#4f7cff;box-shadow:0 0 0 1px #4f7cff}
.tl .node.on .dot{background:#f59e0b;box-shadow:0 0 0 2px #f59e0b}
.tl .node .n{font-size:10px;color:#9ca3af;margin-top:2px}
.tl .node.hot .n{color:#4f7cff;font-weight:600}
.tl .node .ev{display:none;position:absolute;top:46px;left:50%;transform:translateX(-50%);background:#1f2329;color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;width:190px;text-align:left;z-index:10;white-space:normal;line-height:1.5}
.tl .node:hover .ev{display:block}
.tl .node .ev b{display:block;color:#93c5fd;margin-bottom:2px}
.tl .node.dim{opacity:.35}
.tl .node.dim .dot{background:#cbd5e1}
.tl .node.dim .n{color:#94a3b8}
.tl .node.dim:hover .ev{display:none}

/* ---- 剧情: 章纲卡片 ---- */
.olcard{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 16px;margin-bottom:10px;scroll-margin-top:120px}
.olcard .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.olcard .h .no{background:#4f7cff;color:#fff;font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600}
.olcard .h .t{font-weight:700;font-size:14px}
.olcard .h .meta{font-size:11px;color:#9ca3af;margin-left:auto}
.olcard .sum{font-size:13px;color:#374151;line-height:1.7;margin:8px 0 0}
.olcard .fg{font-size:12px;color:#8b5cf6;background:#f5f3ff;border-radius:6px;padding:6px 10px;margin-top:8px;line-height:1.6}
.olcard .scn{font-size:12px;color:#6b7280;margin-top:6px}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;border:1px solid #d1d5db;border-radius:14px;padding:2px 10px;cursor:pointer;background:#fff;color:#374151}
.chip .c{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip:hover{border-color:#4f7cff}

/* ---- 人物 ---- */
.cwrap{display:flex;gap:14px;height:660px}
#cgraph{flex:7;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;position:relative}
#cgraph svg{width:100%;height:100%}
#cside{flex:3;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow-y:auto;padding:16px;font-size:13px;line-height:1.7}
.node{stroke:#fff;stroke-width:1.5;cursor:pointer}
.node:hover{stroke:#ff9800;stroke-width:3}
.edge{stroke:#d1d5db;stroke-width:1;opacity:.6}
.edge.relation{stroke:#f59e0b;stroke-width:1.6}
.edge.cooccur{stroke:#9ca3af}
.lbl{font-size:11px;fill:#374151;pointer-events:none;text-anchor:middle}
.clegend{position:absolute;top:10px;left:10px;font-size:11px;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:8px;padding:6px 10px;line-height:1.8}
.clegend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.cavatar{width:52px;height:52px;border-radius:12px;background:#4f7cff;color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
.cname{font-size:16px;font-weight:700;margin:6px 0 2px}
.calias{font-size:12px;color:#9ca3af;margin-bottom:8px}
.csec{background:#f9fafb;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:12px;line-height:1.8}
.csec b{color:#4f7cff}
.ev{margin:5px 0;padding:5px 8px;background:#f9fafb;border-radius:6px;font-size:12px;border-left:3px solid #4f7cff}
.dim-missing{font-size:11px;color:#9ca3af;font-style:italic}

/* ---- 设定 ---- */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.setcard{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;border-top:3px solid #06b6d4}
.setcard.cat{grid-column:1/-1;border:none;background:transparent;padding:0;margin-top:6px}
.setcard.cat h3{font-size:15px;color:#4f7cff}
.setcard.cat h3 span{font-size:12px;color:#9ca3af;font-weight:400;margin-left:8px}
.setcard h4{font-size:14px;margin-bottom:4px}
.setcard .ty{display:inline-block;font-size:10px;background:#eef2ff;color:#4f7cff;border-radius:4px;padding:1px 6px;margin-bottom:6px}
.setcard .desc{font-size:12px;color:#374151;line-height:1.7}
.setcard .mt{font-size:11px;color:#9ca3af;margin-top:6px}
.setcard .note{font-size:11px;color:#8b5cf6;margin-top:4px}

/* ---- 文风 ---- */
.stylenav{font-size:11px;color:#9ca3af;margin-bottom:10px}
.swrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.scard{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px}
.scard h3{font-size:14px;margin-bottom:10px;color:#1f2329;border-left:3px solid #4f7cff;padding-left:8px}
.scard .statrow{display:flex;gap:10px;flex-wrap:wrap}
.scard .stat{flex:1;min-width:90px;background:#f9fafb;border-radius:8px;padding:8px;text-align:center}
.scard .stat .v{font-size:18px;font-weight:700;color:#4f7cff}
.scard .stat .k{font-size:11px;color:#6b7280;margin-top:2px}
table.st{width:100%;border-collapse:collapse;font-size:12px}
table.st th,table.st td{padding:5px 8px;border-bottom:1px solid #f3f4f6;text-align:left}
table.st th{color:#6b7280;font-weight:600}
table.st td:last-child,table.st th:last-child{text-align:right}
.cloud{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;min-height:150px;padding:10px;background:#fafbfc;border-radius:8px}
.cloud span{line-height:1.2;color:#374151;cursor:default}
.cloud span:hover{color:#4f7cff}
.sumblock{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-top:12px}
.sumblock h3{font-size:14px;margin-bottom:10px;border-left:3px solid #8b5cf6;padding-left:8px}
.sumblock .line{font-size:13px;color:#374151;line-height:1.8;margin:6px 0}
.sumblock .line b{color:#4f7cff}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:80;align-items:center;justify-content:center}
.mask.open{display:flex}
.modal{background:#fff;border-radius:12px;width:min(480px,92vw);max-height:70vh;overflow-y:auto;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.modal h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.modal .it{padding:8px 10px;background:#f9fafb;border-radius:8px;margin:6px 0;font-size:13px}
.modal .it b{color:#4f7cff}
.modal .x{margin-left:auto;cursor:pointer;color:#9ca3af;font-size:16px}
.modal .x:hover{color:#1f2329}
.mt{font-size:11px;color:#9ca3af;margin-top:8px}

@media(max-width:820px){
  .cwrap{flex-direction:column;height:auto}
  #cgraph{height:60vh}
  .rangeaxis{min-width:160px}
  main{padding:10px 12px 40px}
}
</style>
</head>
<body>

<header>
  <h1>📖 拆书详情页</h1>
  <span class="sub" id="bookSub"></span>
</header>

<div class="gfilter">
  <label>章节筛选</label>
  <label>首章 <input class="numin" id="chStart" type="number" min="1" value="1"></label>
  <label>末章 <input class="numin" id="chEnd" type="number" value="50"></label>
  <div class="rangeaxis" id="rangeAxis" title="拖动两端滑块 / 点击轨道跳转 / 输入首末章精确筛选">
    <div class="ra-track"><div class="ra-range" id="raRange"></div></div>
  </div>
  <button class="chip" id="chAll" style="font-size:12px">全部章节</button>
  <span class="stat" id="filterStat"></span>
</div>

<div class="tabs" id="tabs">
  <div class="tab active" data-v="plot">剧情</div>
  <div class="tab" data-v="char">人物</div>
  <div class="tab" data-v="setting">设定</div>
  <div class="tab" data-v="style">文风</div>
</div>

<main>
  <!-- ================= Tab1 剧情 ================= -->
  <section class="tabpane active" id="pane-plot">
    <div class="tlwrap">
      <div class="tl" id="timeline"></div>
    </div>
    <div id="olList"></div>
  </section>

  <!-- ================= Tab2 人物 ================= -->
  <section class="tabpane" id="pane-char">
    <div class="cwrap">
      <div id="cgraph">
        <div class="clegend"><span class="dot" style="background:#4f7cff"></span>人物
          <br><span style="color:#f59e0b">─</span>显式关系
          <br><span style="color:#9ca3af">─</span>同场景共现</div>
      </div>
      <div id="cside"><div class="mt">点击左侧图谱节点查看人物画像</div></div>
    </div>
  </section>

  <!-- ================= Tab3 设定 ================= -->
  <section class="tabpane" id="pane-setting">
    <div class="setgrid" id="setGrid"></div>
  </section>

  <!-- ================= Tab4 文风 ================= -->
  <section class="tabpane" id="pane-style">
    <div class="stylenav" id="styleNav"></div>
    <div class="swrap" id="styleGrid"></div>
    <div class="sumblock" id="styleSum"></div>
  </section>
</main>

<!-- 弹窗 -->
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
// ===== 数据注入点 =====
const DETAIL_DATA = __DETAIL_DATA__;

// 全局状态 (声明必须在任何调用之前 —— 防 TDZ)
let curTab = 'plot';
const D = DETAIL_DATA;
const charById = {}; D.characters.forEach(c => charById[c.name] = c);

// 图谱画布状态
let gW=0, gH=0, gSvg=null, gEl=null, gEdgeEl=null, gNodeEl=null, gLblEl=null;
const gNODES=[], gEDGES=[];
let gActive=null;

// ---------- 全局筛选器: 章节范围轴 ----------
let selStart = 1, selEnd = D.chapters.length;   // 首末章范围(闭区间)
let dragIdx = null;                              // 正在拖 0=首章 1=末章

function inRange(no){ return no >= selStart && no <= selEnd; }

// 范围轴位置换算: 与轨道内缩 8px 对齐, 首末章对齐刻度
function raPx(ax, no){
  const w=ax.clientWidth, n=D.chapters.length, L=8, R=8;
  return (L + (no-1)/(n-1)*(w-L-R))/w*100;
}
function noFromX(ax, x){
  const w=ax.clientWidth, n=D.chapters.length, L=8, R=8;
  const t=Math.min(w-L-R, Math.max(0, x-L));
  return Math.round(t/(w-L-R)*(n-1))+1;
}

function buildRangeAxis(){
  const ax=document.getElementById('rangeAxis');
  const n=D.chapters.length;
  // 刻度(最多 20 个可见)
  const step = n>20 ? Math.ceil(n/20) : 1;
  for(let i=1;i<=n;i++){
    if(i%n!==1 && i!==n && i%step!==1) continue;
    const t=document.createElement('div');
    t.className='ra-tick';
    t.style.left=raPx(ax,i)+'%';
    t.title=D.chapters[i-1].title;
    ax.appendChild(t);
  }
  // 两个滑块
  ['start','end'].forEach((k,i)=>{
    const th=document.createElement('div');
    th.className='ra-thumb'+(i?' end':'');
    th.dataset.kind=k;
    ax.appendChild(th);
  });
  // 拖动滑块
  ax.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('ra-thumb')){
      dragIdx = e.target.dataset.kind==='start'?0:1;
      e.target.classList.add('dragging');
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove',e=>{
    if(dragIdx===null) return;
    const ax=document.getElementById('rangeAxis');
    const r=ax.getBoundingClientRect();
    const x=Math.min(r.width-1, Math.max(0, e.clientX-r.left));
    setThumb(dragIdx, noFromX(ax, x));
  });
  document.addEventListener('mouseup',()=>{
    if(dragIdx!==null){
      document.querySelectorAll('.ra-thumb').forEach(t=>t.classList.remove('dragging'));
      dragIdx=null;
    }
  });
  // 点击轨道: 移动离点击处最近的滑块
  ax.addEventListener('click',e=>{
    if(e.target.classList.contains('ra-thumb')) return;
    const r=ax.getBoundingClientRect();
    const x=Math.min(r.width-1, Math.max(0, e.clientX-r.left));
    const no=noFromX(ax, x);
    const ds=Math.abs(no-selStart), de=Math.abs(no-selEnd);
    setThumb(ds<=de?0:1, no);
  });
  // 首末章输入框
  const si=document.getElementById('chStart'), ei=document.getElementById('chEnd');
  si.value=selStart; ei.value=selEnd;
  si.onchange=()=>{ const v=Math.max(1,Math.min(n,parseInt(si.value)||1)); setRange(v,selEnd); };
  ei.onchange=()=>{ const v=Math.max(1,Math.min(n,parseInt(ei.value)||n)); setRange(selStart,v); };
  document.getElementById('chAll').onclick=()=>setRange(1,n);
  drawRangeAxis();
}

function setThumb(idx, no){
  const n=D.chapters.length;
  no=Math.max(1,Math.min(n,no));
  if(idx===0){ if(no>selEnd) no=selEnd; selStart=no; }
  else { if(no<selStart) no=selStart; selEnd=no; }
  document.getElementById('chStart').value=selStart;
  document.getElementById('chEnd').value=selEnd;
  drawRangeAxis();
  applyRange();
}

function setRange(s,e){
  const n=D.chapters.length;
  s=Math.max(1,Math.min(n,s)); e=Math.max(1,Math.min(n,e));
  if(s>e){ const t=s; s=e; e=t; }
  selStart=s; selEnd=e;
  document.getElementById('chStart').value=s;
  document.getElementById('chEnd').value=e;
  drawRangeAxis();
  applyRange();
}

function drawRangeAxis(){
  const ax=document.getElementById('rangeAxis');
  const startEl=ax.querySelector('.ra-thumb:not(.end)');
  const endEl=ax.querySelector('.ra-thumb.end');
  const rangeEl=document.getElementById('raRange');
  startEl.style.left=raPx(ax,selStart)+'%';
  endEl.style.left=raPx(ax,selEnd)+'%';
  rangeEl.style.left=raPx(ax,selStart)+'%';
  rangeEl.style.width=(raPx(ax,selEnd)-raPx(ax,selStart))+'%';
  let lbl=ax.querySelector('.ra-label');
  if(!lbl){ lbl=document.createElement('div'); lbl.className='ra-label'; ax.appendChild(lbl); }
  let lbl2=ax.querySelector('.ra-label.end');
  if(!lbl2){ lbl2=document.createElement('div'); lbl2.className='ra-label end'; ax.appendChild(lbl2); }
  lbl.textContent='第'+selStart+'章';
  lbl.style.left=raPx(ax,selStart)+'%';
  lbl2.textContent='第'+selEnd+'章';
  lbl2.style.left=raPx(ax,selEnd)+'%';
}

// ---------- 章节筛选核心 ----------
function applyRange(){
  document.getElementById('filterStat').innerHTML =
    `当前：<b>第 ${selStart}-${selEnd} 章</b> <span style="color:#9ca3af;font-size:11px">（共 ${selEnd-selStart+1} 章）</span>`;
  if(curTab==='plot') renderPlot();
  else if(curTab==='char') renderCharGraph();
  else if(curTab==='setting') renderSettings();
  else renderStyle();
}

// ---------- Tab 切换 ----------
function showTab(v){
  curTab=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('active',p.id==='pane-'+v));
  applyRange();
}

// ================= Tab1 剧情 =================
function renderPlot(){
  const tl=document.getElementById('timeline');
  tl.innerHTML='';
  const n=D.chapters.length;
  tl.style.minWidth=Math.max(1200, n*34)+'px';
  tl.innerHTML='<div class="line"></div><div class="prog" id="tlProg"></div>';
  const prog=tl.querySelector('.prog');
  prog.style.width=((selEnd-0.5)/n*100)+'%';
  prog.style.left=((selStart-0.5)/n*100)+'%';
  D.timeline.forEach(t=>{
    const evs=t.events;
    const node=document.createElement('div');
    node.className='node'+(evs.length?' hot':'')+(t.no>=selStart&&t.no<=selEnd?' on':'')+
      (!inRange(t.no)?' dim':'');
    node.style.left=( (t.no-0.5)/n*100 )+'%';
    node.innerHTML=`<div class="dot"></div><div class="n">${t.no}</div>`+
      (evs.length?`<div class="ev"><b>第${t.no}章 ${(D.chapters[t.no-1].title||'').replace(/^第.+?章\s*/,'')}</b>${evs.slice(0,3).map(e=>'• '+e.text).join('<br>')}</div>`:'');
    node.onclick=()=>{ setRange(t.no, t.no); };
    tl.appendChild(node);
  });

  // 章纲列表
  const ol=D.outlines;
  const list=document.getElementById('olList');
  list.innerHTML='';
  ol.forEach(o=>{
    if(!inRange(o.no)) return;
    const tag=D.tags[o.no]||{};
    const card=document.createElement('div');
    card.className='olcard'; card.id='ol-'+o.no;
    let chips='';
    if(tag.newChars.length) chips+=`<span class="chip" data-kind="人物" data-no="${o.no}" data-idx="0"><span class="c" style="background:#22c55e"></span>人物×${tag.newChars.length}</span>`;
    if(tag.newSettings.length) chips+=`<span class="chip" data-kind="设定" data-no="${o.no}" data-idx="1"><span class="c" style="background:#3b82f6"></span>设定×${tag.newSettings.length}</span>`;
    if(tag.newScenes.length) chips+=`<span class="chip" data-kind="场景" data-no="${o.no}" data-idx="2"><span class="c" style="background:#f59e0b"></span>场景×${tag.newScenes.length}</span>`;
    card.innerHTML=`
      <div class="h"><span class="no">第 ${o.no} 章</span><span class="t">${(o.title||'').replace(/^第.+?章\s*/,'')||'未命名'}</span>
        <span class="meta">${(o.chars||[]).length} 人物 · ${(o.scenes||[]).length} 场景</span></div>
      <div class="sum">${o.summary||'（本章概要待补）'}</div>
      ${o.scenes&&o.scenes.length?`<div class="scn">📍 ${o.scenes.join(' / ')}</div>`:''}
      ${o.foreshadow?`<div class="fg">🔮 伏笔：${o.foreshadow}</div>`:''}
      ${chips?`<div class="chips">${chips}</div>`:''}`;
    list.appendChild(card);
  });
  // 浮点弹窗
  list.querySelectorAll('.chip').forEach(ch=>{
    ch.onclick=()=>{
      const no=+ch.dataset.no, idx=+ch.dataset.idx;
      const tag=D.tags[no];
      const names = idx===0?tag.newChars : idx===1?tag.newSettings : tag.newScenes;
      openModal(ch.dataset.kind, names, no);
    };
  });
  // 滚动到范围首章
  const first=document.getElementById('ol-'+selStart);
  if(first) setTimeout(()=>first.scrollIntoView({behavior:'smooth',block:'start'}),50);
}

// ================= Tab2 人物 =================
function renderCharGraph(){
  const g=document.getElementById('cgraph');
  gW=g.clientWidth; gH=g.clientHeight;
  g.innerHTML='<svg id="csvg" viewBox="0 0 '+gW+' '+gH+'"></svg>';
  gSvg=document.getElementById('csvg');
  gEl=document.createElementNS('http://www.w3.org/2000/svg','g'); gSvg.appendChild(gEl);
  gEdgeEl=document.createElementNS('http://www.w3.org/2000/svg','g'); gEl.appendChild(gEdgeEl);
  gNodeEl=document.createElementNS('http://www.w3.org/2000/svg','g'); gEl.appendChild(gNodeEl);
  gLblEl=document.createElementNS('http://www.w3.org/2000/svg','g'); gEl.appendChild(gLblEl);

  const G=D.charGraph;
  let nodes=G.nodes;
  let edges=G.edges;
  // 按章节范围筛选: 节点 chapters 与 [selStart,selEnd] 有交集
  const visible=G.nodes.filter(n=>{
    const cs=n.chapters&&n.chapters.length? n.chapters : (n.first?[n.first]:[]);
    return cs.some(c=>inRange(c));
  });
  if(visible.length<G.nodes.length){
    const ids=new Set(visible.map(n=>n.id));
    edges=edges.filter(e=>ids.has(e.from)&&ids.has(e.to));
    const conn=new Set(); edges.forEach(e=>{conn.add(e.from);conn.add(e.to);});
    nodes=visible.filter(n=>conn.has(n.id)|| (n.chapters&&n.chapters.some(c=>inRange(c))));
  } else {
    nodes=visible;
  }
  gNODES.length=0; gEDGES.length=0;
  nodes.forEach(n=>{
    const ch=D.characters.find(c=>c.name===n.name)||{};
    // 初始位置用确定性环形布局(去 Math.random, 避免每次重渲染抖动), 力导向开始后自然调整
    gNODES.push({...n, x:gW/2, y:gH/2, vx:0,vy:0,
      r: n.first? 10+Math.min(16,(50-n.first)*0.3):11, d:ch});
  });
  const byId={}; gNODES.forEach(n=>byId[n.id]=n);
  edges.forEach(e=>{ const a=byId[e.from],b=byId[e.to]; if(a&&b) gEDGES.push({a,b,kind:e.kind,label:e.label}); });
  const ang=2*Math.PI/Math.max(1,gNODES.length);
  gNODES.forEach((n,i)=>{ n.x=gW/2+Math.cos(ang*i)*(gW*0.34); n.y=gH/2+Math.sin(ang*i)*(gH*0.34); });
  drawCharGraph();
  animCharGraph();
}
function drawCharGraph(){
  gEdgeEl.innerHTML='';
  gEDGES.forEach(e=>{
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('class','edge '+e.kind);
    l.setAttribute('x1',e.a.x);l.setAttribute('y1',e.a.y);
    l.setAttribute('x2',e.b.x);l.setAttribute('y2',e.b.y);
    gEdgeEl.appendChild(l); e.el=l;
  });
  gNodeEl.innerHTML=''; gLblEl.innerHTML='';
  gNODES.forEach(n=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('class','node'); c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',n.r);
    c.setAttribute('fill',n.color); c.setAttribute('data-id',n.id);
    c.onclick=()=>showPortrait(n.name);
    c.onmouseover=()=>highlightChar(n,true);
    c.onmouseout=()=>highlightChar(n,false);
    gNodeEl.appendChild(c); n.el=c;
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','lbl'); t.setAttribute('x',n.x); t.setAttribute('y',n.y+n.r+11);
    t.textContent=n.name.length>5? n.name.slice(0,5)+'…':n.name;
    gLblEl.appendChild(t); n.tEl=t;
  });
}
function animCharGraph(){
  for(let it=0;it<45;it++){
    gEDGES.forEach(e=>{
      let dx=e.b.x-e.a.x,dy=e.b.y-e.a.y; let d=Math.hypot(dx,dy)||1;
      const tgt=60+(e.a.r+e.b.r), f=(d-tgt)*0.02;
      const fx=dx/d*f, fy=dy/d*f;
      e.a.vx+=fx; e.a.vy+=fy; e.b.vx-=fx; e.b.vy-=fy;
    });
    for(let i=0;i<gNODES.length;i++)for(let j=i+1;j<gNODES.length;j++){
      const a=gNODES[i],b=gNODES[j];
      let dx=b.x-a.x,dy=b.y-a.y; let d=Math.hypot(dx,dy)||1; if(d<1)d=1;
      const f=900/(d*d), fx=dx/d*f, fy=dy/d*f;
      a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
    }
    gNODES.forEach(n=>{
      n.vx*=0.85; n.vy*=0.85; n.x+=n.vx; n.y+=n.vy;
      const m=24; n.x=Math.max(m,Math.min(gW-m,n.x)); n.y=Math.max(m,Math.min(gH-m,n.y));
    });
  }
  gNODES.forEach(n=>{ n.vx+=(gW/2-n.x)*0.004; n.vy+=(gH/2-n.y)*0.004; n.x+=n.vx; n.y+=n.vy; });
  drawCharGraph();
}
function highlightChar(n,on){
  gEDGES.forEach(e=>{
    const rel = e.a===n || e.b===n;
    e.el.setAttribute('opacity', on? (rel?1:0.06): (e.kind==='relation'?0.7:0.5));
    e.el.setAttribute('stroke-width', on&&rel? 2.6 : e.kind==='relation'?1.6:1);
  });
  gNODES.forEach(x=>{
    x.el.setAttribute('opacity', on? (x===n||gEDGES.some(e=>(e.a===x||e.b===x)&&(e.a===n||e.b===n))?1:0.25):1);
  });
}

// ---------- 人物画像 (含六维雷达图) ----------
const DIMS=[
  ['混沌','守序'],['善良','邪恶'],['理智','感性'],
  ['内向','外向'],['果断','犹豫'],['隐忍','张扬']];
function showPortrait(name){
  const c=D.characters.find(x=>x.name===name);
  if(!c) return;
  gActive=name;
  gNODES.forEach(n=>{ if(n.el) n.el.setAttribute('stroke-width', n.name===name?4:1.5); });
  const side=document.getElementById('cside');
  const dims=c.dims||{};
  const hasDim=Object.keys(dims).length>0;
  let html=`<div class="cavatar">${(c.name||'?')[0]}</div>
    <div class="cname">${c.name}</div>
    <div class="calias">${(c.aliases||[]).length? '别名：'+c.aliases.join('、') : ''}</div>
    <div class="csec"><b>身份</b><br>${c['身份']||'待补'}</div>
    <div class="csec"><b>首次出场</b> 第${c['首次出现章']||'?'}章</div>`;
  html+=`<h3 style="font-size:13px;margin:10px 0 4px">性格六维</h3>`;
  if(hasDim){
    html+=radarSVG(dims);
    html+='<div style="display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:#6b7280;margin-top:4px">'+
      DIMS.map((d,i)=>`${d[0]} ${(dims[DIMS[i].join('')] ?? dims[Object.keys(dims)[i]]) || '—'} ${d[1]}`).join('  |  ')+'</div>';
  } else {
    html+=`<div class="dim-missing">性格六维数据待生成（LLM 分析中）——先用 50 中性占位。</div>`;
  }
  if(c['弧光']) html+=`<div class="csec"><b>人物弧光</b><br>${c['弧光']}</div>`;
  if((c['关键事件']||[]).length){
    html+='<b style="font-size:13px">关键事件</b>';
    c['关键事件'].forEach(ev=>html+=`<div class="ev">${ev}</div>`);
  }
  html+=`<div class="mt">数据源：stage2 人物档案（LLM 抽取自原文）</div>`;
  side.innerHTML=html;
}
function radarSVG(dims){
  const size=230, cx=size/2, cy=size/2+6, R=76;
  const keys=DIMS.map(d=>d.join(''));
  const vals=keys.map(k=>{
    const v=Number(dims[k]);
    return isNaN(v)?50:Math.max(0,Math.min(100,v));
  });
  let svg=`<svg width="${size}" height="${size*0.82}" viewBox="0 0 ${size} ${size*0.82}" style="display:block;margin:0 auto">`;
  // 网格
  for(let ring=1;ring<=4;ring++){
    const rr=R*ring/4;
    let pts=[];
    for(let i=0;i<6;i++){
      const a=Math.PI/2 + i*Math.PI/3;
      pts.push(`${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`);
    }
    svg+=`<polygon points="${pts.join(' ')}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`;
  }
  // 轴线 + 标签
  for(let i=0;i<6;i++){
    const a=Math.PI/2 + i*Math.PI/3;
    const ex=cx+R*Math.cos(a), ey=cy+R*Math.sin(a);
    svg+=`<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>`;
    const lx=cx+(R+16)*Math.cos(a), ly=cy+(R+16)*Math.sin(a);
    const [lo,hi]=DIMS[i];
    const tx=lx-(Math.abs(Math.cos(a))<0.3? lo.length*6+10 : Math.cos(a)>0? lo.length*6+4 : 4);
    svg+=`<text x="${tx.toFixed(0)}" y="${(ly+4).toFixed(0)}" font-size="10" fill="#9ca3af" text-anchor="middle">${lo}</text>`;
    const t2x=lx+(Math.abs(Math.cos(a))<0.3? hi.length*6-4 : Math.cos(a)>0? -hi.length*6-6 : hi.length*6);
    svg+=`<text x="${t2x.toFixed(0)}" y="${(ly+4).toFixed(0)}" font-size="10" fill="#9ca3af" text-anchor="middle">${hi}</text>`;
  }
  // 数据多边形
  let pts=[];
  for(let i=0;i<6;i++){
    const a=Math.PI/2 + i*Math.PI/3;
    const rr=R*vals[i]/100;
    pts.push(`${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`);
  }
  svg+=`<polygon points="${pts.join(' ')}" fill="rgba(79,124,255,.28)" stroke="#4f7cff" stroke-width="2"/>`;
  for(let i=0;i<6;i++){
    const a=Math.PI/2 + i*Math.PI/3;
    const rr=R*vals[i]/100;
    svg+=`<circle cx="${(cx+rr*Math.cos(a)).toFixed(1)}" cy="${(cy+rr*Math.sin(a)).toFixed(1)}" r="3" fill="#4f7cff"/>`;
  }
  svg+='</svg>';
  return svg;
}

// ================= Tab4 文风 =================
function renderStyle(){
  const nav=document.getElementById('styleNav');
  const grid=document.getElementById('styleGrid');
  const sum=document.getElementById('styleSum');
  const ST=D.style;
  const isFull = (selStart===1 && selEnd===D.chapters.length);
  let words, sent, punc, sp, rh, avg, shortPct, longPct, scope;
  if(isFull){
    words=ST.wordFreq; sent=ST.sentence; punc=ST.punctuation; sp=ST.special; rh=ST.rhetoric;
    avg=sent.avg; shortPct=sent.shortPct; longPct=sent.longPct;
    scope=ST.scope;
  } else {
    const pcs = D.perChStyle.filter(p=>inRange(p.no));
    // 词频聚合(perChStyle.words 为逐章 top25, 聚合后按频次重排)
    const agg={};
    pcs.forEach(p=>(p.words||[]).forEach(w=>{ agg[w.w]=(agg[w.w]||0)+w.n; }));
    words=Object.entries(agg).map(([w,n])=>({word:w,count:n,pct:0}))
      .sort((a,b)=>b.count-a.count).slice(0,60);
    // 句长: 按字数加权平均
    let tw=0, ta=0;
    pcs.forEach(p=>{ const c=p.chars||0; tw+=c; ta+=(p.avgLen||0)*c; });
    avg = tw? (Math.round(ta/tw*10)/10) : '—';
    shortPct=longPct=null;
    sent={avg:avg,dist:[],total:0};
    // 标点 / 特殊句式 / 修辞: 逐章统计求和
    const puncAgg={};
    pcs.forEach(p=>(p.punctuation||[]).forEach(x=>{puncAgg[x.p]=(puncAgg[x.p]||0)+(x.count||0);}));
    punc = ["，","。","！","？","；","：","—","…"].map(k=>({p:k,count:puncAgg[k]||0}));
    const sumObj=(key)=>pcs.reduce((s,p)=>Object.assign(s,p[key]||{}),{});
    sp=sumObj('special'); rh=sumObj('rhetoric');
    scope = `分析范围：第 ${selStart}-${selEnd} 章（${pcs.length} 章，${pcs.reduce((s,p)=>s+(p.chars||0),0).toLocaleString()} 字）`;
  }
  nav.textContent = scope;
  const maxN=Math.max(1,...words.map(w=>w.count));
  const cloud=words.slice(0,60).map(w=>{
    const fs=12+Math.round(30*w.count/maxN);
    const hue=(w.count/maxN)*200+200;
    return `<span style="font-size:${fs}px;color:hsl(${Math.round(hue)},60%,35%)" title="${w.word} ×${w.count}">${w.word}</span>`;
  }).join('');

  const distMax=Math.max(1,...(sent.dist||[]).map(d=>d.count));
  const bars=(sent.dist||[]).map(d=>{
    const h=Math.max(4,Math.round(90*d.count/distMax));
    return `<div style="flex:1;text-align:center;font-size:10px;color:#9ca3af">
      <div style="height:${h}px;background:#4f7cff;border-radius:3px 3px 0 0;margin:0 3px"></div>${d.range}</div>`;
  }).join('');

  const puncRows=punc.map(p=>`<tr><td>${p.p}</td><td>${p.count}</td></tr>`).join('');

  grid.innerHTML=`
    <div class="scard" style="grid-column:1/-1">
      <h3>词云 · 高频词</h3>
      <div class="cloud">${cloud||'<span class="mt">（当前范围无词频数据）</span>'}</div>
    </div>
    <div class="scard">
      <h3>句维 · 句长分布</h3>
      <div class="statrow">
        <div class="stat"><div class="v">${avg||'—'}</div><div class="k">平均句长(字)</div></div>
        <div class="stat"><div class="v">${shortPct!=null?shortPct+'%':'—'}</div><div class="k">短句占比(&lt;15字)</div></div>
        <div class="stat"><div class="v">${longPct!=null?longPct+'%':'—'}</div><div class="k">长句占比(&gt;40字)</div></div>
        <div class="stat"><div class="v">${sent.total||'—'}</div><div class="k">句子总数</div></div>
      </div>
      <div style="display:flex;align-items:flex-end;height:110px;margin-top:10px">${bars}</div>
    </div>
    <div class="scard">
      <h3>断句习惯 · 标点频率</h3>
      <table class="st"><tr><th>标点</th><th>出现次数</th></tr>${puncRows||'<tr><td colspan="2" class="mt">（全书范围）</td></tr>'}</table>
    </div>
    <div class="scard">
      <h3>特殊句式 / 修辞</h3>
      <table class="st">
        <tr><th>类别</th><th>次数</th></tr>
        <tr><td>反问句（难道/岂/怎能…）</td><td>${sp['反问']??'—'}</td></tr>
        <tr><td>感叹句（！）</td><td>${sp['感叹']??'—'}</td></tr>
        <tr><td>排比（近似检测）</td><td>${sp['排比']??'—'}</td></tr>
        <tr><td>比喻（像/仿佛/如同…）</td><td>${rh['比喻']??'—'}</td></tr>
      </table>
    </div>`;

  // 综合结论(数据驱动)
  let concl=[];
  if(avg){
    if(avg<18) concl.push('平均句长偏短（'+avg+'字），节奏明快，适合紧张场景');
    else if(avg<28) concl.push('平均句长适中（'+avg+'字），叙述流畅');
    else concl.push('平均句长偏长（'+avg+'字），叙述绵密，信息密度高');
  }
  if(shortPct!=null) concl.push(`短句占比 ${shortPct}%、长句占比 ${longPct}%`);
  if(rh['比喻']) concl.push(`比喻 ${rh['比喻']} 处——善用明喻铺陈画面`);
  const top3=words.slice(0,3).map(w=>w.word).join('、');
  if(top3) concl.push(`高频词集中在「${top3}」——${isFull?'全书':'当前范围'}叙事焦点`);
  sum.innerHTML=`<h3>综合结论（数据驱动）</h3>
    ${concl.map(c=>`<div class="line">• ${c}</div>`).join('')}
    <div class="line" style="margin-top:8px"><b>优化建议</b>：基于以上统计——
      ${avg>28? '控制长句密度，关键剧情处改用短句提速；':''}
      ${shortPct!=null&&shortPct<25? '适当增加短句制造节奏变化；':''}
      ${rh['比喻']<50? '可适度补充感官细节与比喻，强化画面感。':'比喻已较充分，注意避免堆砌。'}</div>
    <div class="mt">分析方式：本地规则统计（jieba 分词 + 标点/句式正则）。拟人、夸张等修辞与风格类比建议（如“类似 XX 的笔风”）依赖 LLM 抽样复核，列为待完善项。</div>`;
}
