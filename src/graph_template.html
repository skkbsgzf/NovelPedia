<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识图谱 · 角色关系 + 设定图谱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329}
header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:600}
header .sub{font-size:12px;color:#6b7280}
.controls{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.controls label{font-size:12px;color:#374151}
select,.btn{font-size:13px;padding:5px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff;cursor:pointer}
.btn.active{background:#4f7cff;color:#fff;border-color:#4f7cff}
.btn:hover{background:#eef2ff}
/* 章节范围轴 */
.rangeaxis{flex:1;min-width:240px;position:relative;height:34px;user-select:none}
.ra-track{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);height:6px;background:#e5e7eb;border-radius:3px}
.ra-tick{position:absolute;top:50%;transform:translate(-50%,-50%);width:2px;height:10px;background:#cbd5e1}
.ra-range{position:absolute;top:6px;bottom:6px;background:rgba(79,124,255,.14);border-radius:3px;pointer-events:none}
.ra-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid #4f7cff;cursor:ew-resize;z-index:3;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.ra-thumb.end{border-color:#f59e0b}
.ra-thumb.dragging{transform:translate(-50%,-50%) scale(1.2)}
.ra-label{position:absolute;top:-20px;transform:translateX(-50%);font-size:11px;font-weight:600;color:#4f7cff;white-space:nowrap;pointer-events:none}
.ra-label.end{color:#f59e0b}
.stats{font-size:12px;color:#6b7280;margin-left:auto}
.stats b{color:#4f7cff}
.tabs{display:flex;gap:6px;padding:10px 20px 0}
.tab{padding:8px 18px;border-radius:8px 8px 0 0;font-size:13px;cursor:pointer;border:1px solid transparent;background:#e5e7eb;color:#374151}
.tab.active{background:#fff;border-color:#e5e7eb;border-bottom-color:#fff;color:#4f7cff;font-weight:600}
main{display:flex;padding:10px 20px 20px;gap:14px;height:calc(100vh - 160px);min-height:420px}
#graph{flex:1;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;position:relative}
#graph svg{width:100%;height:100%}
#side{width:330px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow-y:auto;padding:14px;font-size:13px;line-height:1.7}
#side h3{font-size:14px;margin-bottom:8px;color:#4f7cff}
#side .muted{color:#9ca3af;font-size:12px}
#side .tag{display:inline-block;background:#eef2ff;color:#4f7cff;border-radius:4px;padding:1px 6px;font-size:11px;margin:2px 2px 0 0}
#side .ev{margin:4px 0;padding:5px 8px;background:#f9fafb;border-radius:6px;font-size:12px}
#side .ev b{color:#374151}
.node{stroke:#fff;stroke-width:1.5;cursor:pointer}
.node:hover{stroke:#ff9800;stroke-width:3}
.edge{stroke:#d1d5db;stroke-width:1;opacity:.6}
.edge.relation{stroke:#f59e0b;stroke-width:1.5}
.edge.cooccur{stroke:#9ca3af}
.edge.related{stroke:#3b82f6}
.lbl{font-size:11px;fill:#374151;pointer-events:none;text-anchor:middle}
  .elbl{font-size:9px;fill:#475569;pointer-events:none;
    paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
  .edge.relation+.elbl{fill:#b45309}
  .edge.related+.elbl{fill:#1d4ed8}
.legend{position:absolute;top:10px;left:10px;font-size:11px;background:rgba(255,255,255,.92);border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;line-height:1.9}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:14px}
@media(max-width:820px){main{flex-direction:column;height:auto}#side{width:100%}#graph{height:60vh}}
</style>
</head>
<body>
<header>
  <h1 id="title">📚 知识图谱</h1>
  <span class="sub">角色关系图谱 + 设定图谱 · 全部节点/边支持章节筛选</span>
</header>

<div class="controls">
  <label>视图</label>
  <select id="viewSel">
    <option value="char">角色关系图谱</option>
    <option value="setting">设定图谱</option>
    <option value="all">全局（角色+设定）</option>
  </select>
  <label>首章 <input id="gStart" type="number" min="1" style="width:50px;padding:4px 6px;font-size:13px;border:1px solid #d1d5db;border-radius:6px;outline:none"></label>
  <label>末章 <input id="gEnd" type="number" style="width:50px;padding:4px 6px;font-size:13px;border:1px solid #d1d5db;border-radius:6px;outline:none"></label>
  <div class="rangeaxis" id="gRangeAxis" title="拖动两端滑块 / 点击轨道跳转 / 输入首末章筛选">
    <div class="ra-track"><div class="ra-range" id="gRaRange"></div></div>
  </div>
  <button class="btn" id="btnAll">全部章节</button>
  <label class="gfilter" id="typeLab" style="display:none">设定类型</label>
  <select class="numin" id="typeSel" style="display:none"></select>
  <button class="btn" id="btnEdges" title="点击切换关联线显示/隐藏">隐藏关联线</button>
  <div class="stats" id="stats"></div>
</div>

<div class="tabs">
  <div class="tab active" data-view="char">角色图谱</div>
  <div class="tab" data-view="setting">设定图谱</div>
  <div class="tab" data-view="all">全局</div>
</div>

<main>
  <div id="graph">
    <div class="legend" id="legend"></div>
  </div>
  <div id="side">
    <div class="muted">点击图谱节点查看详情；拖动上方章节范围轴筛选，图谱与详情随筛选联动。</div>
  </div>
</main>

<script>
// ===== 数据注入点: 由 export_graph.py 替换为 JSON =====
const GRAPH_DATA = __GRAPH_DATA__;

let view = 'char';
let selType = 'all';          // 设定类型筛选 (仅 setting/all 视图生效)
let showEdges = true;         // 是否显示关联线
let sim = null;               // {nodes:[...], edges:[...]} 当前可视子图
const DATA = GRAPH_DATA;
// 章节范围筛选
let gStart = 1, gEnd = DATA.chapters.length;
let gDragIdx = null;
function inRange(no){ return no >= gStart && no <= gEnd; }
// 权重可视化: 把"出现章数"映射成 0-100 的条形
function weightBar(w){
  const pct=Math.min(100, Math.max(0, Math.sqrt(w))*10);
  return `<span style="display:inline-block;width:60px;height:6px;background:#e5e7eb;border-radius:3px;vertical-align:middle"><span style="display:block;width:${pct}%;height:100%;background:linear-gradient(90deg,#93c5fd,#4f7cff);border-radius:3px"></span></span>`;
}
// 范围轴位置换算: 与轨道内缩 8px 对齐, 首末章对齐刻度
function gRaPx(ax, no){
  const w=ax.clientWidth, n=DATA.chapters.length, L=8, R=8;
  return (L + (no-1)/(n-1)*(w-L-R))/w*100;
}
function gNoFromX(ax, x){
  const w=ax.clientWidth, n=DATA.chapters.length, L=8, R=8;
  const t=Math.min(w-L-R, Math.max(0, x-L));
  return Math.round(t/(w-L-R)*(n-1))+1;
}
// 画布状态(必须在 applyFilter/renderGraph 之前声明, 否则 TDZ 报错白屏)
let w = 0, h = 0, svg, gEl, edgeEl, nodeEl, lblEl;
let activeNodeId = null;
const NODES = [], EDGES = [];

// ---------- 初始化 ----------
document.getElementById('title').textContent =
  `📚 知识图谱 · ${DATA.chapters.length} 章`;
DATA.nodeById = {};
DATA.nodes.forEach(n=>DATA.nodeById[n.id]=n);
buildRangeAxis();
buildTypeFilter();
applyFilter();

function buildTypeFilter(){
  const sel=document.getElementById('typeSel');
  const lab=document.getElementById('typeLab');
  const types = Array.from(new Set(DATA.nodes.filter(n=>n.kind==='setting').map(n=>n.type))).sort();
  sel.innerHTML = '<option value="all">全部类型</option>' +
    types.map(t=>`<option value="${t}">${t}</option>`).join('');
  sel.onchange=()=>{
    selType=sel.value;
    applyFilter();
  };
  document.getElementById('btnEdges').onclick=()=>{
    showEdges=!showEdges;
    document.getElementById('btnEdges').textContent = showEdges?'隐藏关联线':'显示关联线';
    if(sim) drawAll();
  };
  syncTypeFilterVisibility();
}

function syncTypeFilterVisibility(){
  const show = (view==='setting' || view==='all');
  document.getElementById('typeLab').style.display = show?'':'none';
  document.getElementById('typeSel').style.display = show?'':'none';
}

function buildRangeAxis(){
  const ax=document.getElementById('gRangeAxis');
  const n=DATA.chapters.length;
  const step = n>20 ? Math.ceil(n/20) : 1;
  for(let i=1;i<=n;i++){
    if(i%n!==1 && i!==n && i%step!==1) continue;
    const t=document.createElement('div');
    t.className='ra-tick';
    t.style.left=gRaPx(ax,i)+'%';
    t.title=DATA.chapters[i-1].title||('第'+i+'章');
    ax.appendChild(t);
  }
  ['start','end'].forEach((k,i)=>{
    const th=document.createElement('div');
    th.className='ra-thumb'+(i?' end':'');
    th.dataset.kind=k;
    ax.appendChild(th);
  });
  ax.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('ra-thumb')){
      gDragIdx = e.target.dataset.kind==='start'?0:1;
      e.target.classList.add('dragging');
      e.preventDefault();
    }
  });
  document.addEventListener('mousemove',e=>{
    if(gDragIdx===null) return;
    const ax=document.getElementById('gRangeAxis');
    const r=ax.getBoundingClientRect();
    const x=Math.min(r.width-1, Math.max(0, e.clientX-r.left));
    setGThumb(gDragIdx, gNoFromX(ax, x));
  });
  document.addEventListener('mouseup',()=>{
    if(gDragIdx!==null){
      document.querySelectorAll('.ra-thumb').forEach(t=>t.classList.remove('dragging'));
      gDragIdx=null;
    }
  });
  ax.addEventListener('click',e=>{
    if(e.target.classList.contains('ra-thumb')) return;
    const r=ax.getBoundingClientRect();
    const x=Math.min(r.width-1, Math.max(0, e.clientX-r.left));
    const no=gNoFromX(ax, x);
    const ds=Math.abs(no-gStart), de=Math.abs(no-gEnd);
    setGThumb(ds<=de?0:1, no);
  });
  const si=document.getElementById('gStart'), ei=document.getElementById('gEnd');
  si.value=gStart; ei.value=gEnd;
  si.onchange=()=>{ const v=Math.max(1,Math.min(n,parseInt(si.value)||1)); setGRange(v,gEnd); };
  ei.onchange=()=>{ const v=Math.max(1,Math.min(n,parseInt(ei.value)||n)); setGRange(gStart,v); };
  document.getElementById('btnAll').onclick=()=>setGRange(1,n);
  drawRangeAxis();
}

function setGThumb(idx, no){
  const n=DATA.chapters.length;
  no=Math.max(1,Math.min(n,no));
  if(idx===0){ if(no>gEnd) no=gEnd; gStart=no; }
  else { if(no<gStart) no=gStart; gEnd=no; }
  document.getElementById('gStart').value=gStart;
  document.getElementById('gEnd').value=gEnd;
  drawRangeAxis();
  applyFilter();
}

function setGRange(s,e){
  const n=DATA.chapters.length;
  s=Math.max(1,Math.min(n,s)); e=Math.max(1,Math.min(n,e));
  if(s>e){ const t=s; s=e; e=t; }
  gStart=s; gEnd=e;
  document.getElementById('gStart').value=s;
  document.getElementById('gEnd').value=e;
  drawRangeAxis();
  applyFilter();
}

function drawRangeAxis(){
  const ax=document.getElementById('gRangeAxis');
  const sEl=ax.querySelector('.ra-thumb:not(.end)');
  const eEl=ax.querySelector('.ra-thumb.end');
  const rEl=document.getElementById('gRaRange');
  sEl.style.left=gRaPx(ax,gStart)+'%';
  eEl.style.left=gRaPx(ax,gEnd)+'%';
  rEl.style.left=gRaPx(ax,gStart)+'%';
  rEl.style.width=(gRaPx(ax,gEnd)-gRaPx(ax,gStart))+'%';
  let lbl=ax.querySelector('.ra-label');
  if(!lbl){ lbl=document.createElement('div'); lbl.className='ra-label'; ax.appendChild(lbl); }
  let lbl2=ax.querySelector('.ra-label.end');
  if(!lbl2){ lbl2=document.createElement('div'); lbl2.className='ra-label end'; ax.appendChild(lbl2); }
  lbl.textContent='第'+gStart+'章'; lbl.style.left=gRaPx(ax,gStart)+'%';
  lbl2.textContent='第'+gEnd+'章'; lbl2.style.left=gRaPx(ax,gEnd)+'%';
}

// ---------- 过滤 ----------
function nodeIn(n){ return (n.chapters||[]).some(c=>inRange(c)); }
function edgeIn(e){ return (e.chapters||[]).some(c=>inRange(c)); }

function applyFilter(){
  const nodes = DATA.nodes.filter(n=>{
    if(!nodeIn(n)) return false;
    if(view==='char' && n.kind!=='char') return false;
    if(view==='setting' && n.kind!=='setting') return false;
    if(view!=='char' && selType!=='all' && n.kind==='setting' && n.type!==selType) return false;
    return true;
  });
  const idSet = new Set(nodes.map(n=>n.id));
  let edges = DATA.edges.filter(e=>{
    if(!edgeIn(e)) return false;
    if(!idSet.has(e.from)||!idSet.has(e.to)) return false;
    if(view==='char' && (e.kind==='related')) return false;
    if(view==='setting' && (e.kind==='relation'||e.kind==='cooccur')) return false;
    return true;
  });
  const connected = new Set();
  edges.forEach(e=>{connected.add(e.from);connected.add(e.to);});
  const kept = nodes.filter(n=>connected.has(n.id) || (view==='setting' && nodes.length<40));
  const keptIds = new Set(kept.map(n=>n.id));
  edges = edges.filter(e=>keptIds.has(e.from)&&keptIds.has(e.to));

  sim = { nodes: kept, edges };
  updateStats();
  renderGraph();
  renderLegend();
}

function updateStats(){
  const n=sim.nodes.length, e=sim.edges.length;
  const chs = (gStart===1&&gEnd===DATA.chapters.length)? '全部' : gStart+'-'+gEnd;
  document.getElementById('stats').innerHTML =
    `章节 <b>${chs}</b> · 节点 <b>${n}</b> · 边 <b>${e}</b>`;
}

function renderLegend(){
  const lg=document.getElementById('legend');
  if(view==='char'){
    lg.innerHTML=`<span class="dot" style="background:#4f7cff"></span>角色
      <br><span style="color:#f59e0b">─</span>显式关系
      <br><span style="color:#9ca3af">─</span>同场景共现`;
  }else if(view==='setting'){
    lg.innerHTML=Object.entries({'人物身份':'#8b5cf6','概念':'#06b6d4','物品':'#f59e0b','地点':'#10b981','组织':'#ef4444','力量':'#3b82f6'})
      .map(([k,c])=>`<span class="dot" style="background:${c}"></span>${k}<br>`).join('')
      + `<span style="color:#3b82f6">─</span>related 关联`
      + `<br><span class="muted">筛选: ${selType==='all'?'全部类型':selType} · 节点大小=权重(出现章数+关联边数)</span>`;
  }else{
    lg.innerHTML=`<span class="dot" style="background:#4f7cff"></span>角色
      <span class="dot" style="background:#06b6d4"></span>设定
      <br><span style="color:#f59e0b">─</span>角色关系 <span style="color:#3b82f6">─</span>设定关联`
      + `<br><span class="muted">筛选: ${selType==='all'?'全部类型':selType} · 节点大小=权重</span>`;
  }
}

// ---------- 力导向图 ----------
function renderGraph(){
  const g=document.getElementById('graph');
  w=g.clientWidth; h=g.clientHeight;
  // legend 是 #graph 的子元素, 先摘出避免被 innerHTML 清掉
  const legendEl=g.querySelector('.legend');
  g.innerHTML='<svg id="svgg" viewBox="0 0 '+w+' '+h+'"></svg>';
  if(legendEl) g.appendChild(legendEl);
  svg=document.getElementById('svgg');
  gEl=document.createElementNS('http://www.w3.org/2000/svg','g'); svg.appendChild(gEl);
  edgeEl=document.createElementNS('http://www.w3.org/2000/svg','g'); gEl.appendChild(edgeEl);
  nodeEl=document.createElementNS('http://www.w3.org/2000/svg','g'); gEl.appendChild(nodeEl);
  lblEl=document.createElementNS('http://www.w3.org/2000/svg','g'); gEl.appendChild(lblEl);

  NODES.length=0; EDGES.length=0;
  sim.nodes.forEach(n=>{
    NODES.push({...n, x:w/2+(Math.random()-0.5)*w*0.5, y:h/2+(Math.random()-0.5)*h*0.5,
                vx:0, vy:0, r: 7 + Math.min(22, Math.sqrt(n.weight||1)*2.4)});
  });
  const byId={}; NODES.forEach(n=>byId[n.id]=n);
  sim.edges.forEach(e=>{
    const a=byId[e.from], b=byId[e.to];
    if(a&&b) EDGES.push({a,b,kind:e.kind,label:e.label});
  });
  const ang=2*Math.PI/Math.max(1,NODES.length);
  NODES.forEach((n,i)=>{ n.x=w/2+Math.cos(ang*i)*(w*0.36); n.y=h/2+Math.sin(ang*i)*(h*0.36); });
  drawAll();
  animate();
}

function drawAll(){
  edgeEl.innerHTML='';
  if(!showEdges) return;
  EDGES.forEach(e=>{
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('class','edge '+e.kind);
    l.setAttribute('x1',e.a.x);l.setAttribute('y1',e.a.y);
    l.setAttribute('x2',e.b.x);l.setAttribute('y2',e.b.y);
    l.setAttribute('stroke-width', e.kind==='relation'?1.6:1);
    edgeEl.appendChild(l);
    e.el=l;
    // 关系标签: 边够长时才标注, 避免重叠
    const dx=e.b.x-e.a.x, dy=e.b.y-e.a.y;
    const d=Math.hypot(dx,dy)||1;
    if(e.label && d>46){
      const mx=(e.a.x+e.b.x)/2, my=(e.a.y+e.b.y)/2;
      const ang=Math.atan2(dy,dx)*180/Math.PI;
      const rot=(ang>90||ang<-90)?ang-180:ang;
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('class','elbl');
      t.setAttribute('x',mx);t.setAttribute('y',my);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('dominant-baseline','middle');
      t.setAttribute('transform',`rotate(${rot} ${mx} ${my})`);
      t.textContent=e.label.length>14? e.label.slice(0,14)+'…':e.label;
      edgeEl.appendChild(t);
    }
  });
  nodeEl.innerHTML=''; lblEl.innerHTML='';
  NODES.forEach(n=>{
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('class','node');
    c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);c.setAttribute('r',n.r);
    c.setAttribute('fill',n.color);
    c.setAttribute('data-id',n.id);
    c.onclick=()=>showDetail(n.id);
    nodeEl.appendChild(c);
    n.el=c;
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','lbl');
    t.setAttribute('x',n.x);t.setAttribute('y',n.y+n.r+10);
    t.textContent=n.name.length>12? n.name.slice(0,12)+'…':n.name;
    lblEl.appendChild(t);
    n.tEl=t;
  });
}

function animate(){
  for(let iter=0;iter<50;iter++){
    EDGES.forEach(e=>{
      let dx=e.b.x-e.a.x, dy=e.b.y-e.a.y;
      let d=Math.hypot(dx,dy)||1;
      const target=70+ (e.a.r+e.b.r);
      const f=(d-target)*0.02;
      const fx=dx/d*f, fy=dy/d*f;
      e.a.vx+=fx; e.a.vy+=fy; e.b.vx-=fx; e.b.vy-=fy;
    });
    for(let i=0;i<NODES.length;i++)for(let j=i+1;j<NODES.length;j++){
      const a=NODES[i],b=NODES[j];
      let dx=b.x-a.x, dy=b.y-a.y;
      let d=Math.hypot(dx,dy)||1;
      if(d<1) d=1;
      const f=900/(d*d);
      const fx=dx/d*f, fy=dy/d*f;
      a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
    }
    NODES.forEach(n=>{
      n.vx*=0.85; n.vy*=0.85;
      n.x+=n.vx; n.y+=n.vy;
      const m=24; n.x=Math.max(m,Math.min(w-m,n.x)); n.y=Math.max(m,Math.min(h-m,n.y));
    });
  }
  NODES.forEach(n=>{
    n.vx+=(w/2-n.x)*0.004; n.vy+=(h/2-n.y)*0.004;
    n.x+=n.vx; n.y+=n.vy;
  });
  drawAll();
}

// ---------- 详情 ----------
function showDetail(id){
  const n=DATA.nodeById[id];
  if(!n) return;
  activeNodeId=id;
  document.querySelectorAll('.node').forEach(c=>{
    c.setAttribute('stroke-width', c.getAttribute('data-id')===id?4:1.5);
    c.setAttribute('stroke', c.getAttribute('data-id')===id?'#ff9800':'#fff');
  });
  const side=document.getElementById('side');
  let html=`<h3>${n.kind==='char'?'👤':'🏷️'} ${n.name}</h3>`;
  if(n.kind==='char'){
    if(n.aliases&&n.aliases.length) html+=`<div class="muted">别名: ${n.aliases.join('、')}</div>`;
    if(n['身份']) html+=`<div style="margin:6px 0">${n['身份']}</div>`;
    html+=`<div class="muted">首次出现: 第${n['首次出现章']||'?'}章 · 场景数: ${n.scenes||0}</div>`;
  }else{
    if(n.type) html+=`<div class="muted">类型: ${n.type}</div>`;
    if(n.description) html+=`<div style="margin:6px 0">${n.description}</div>`;
    html+=`<div class="muted">首见: 第${n.first_seen||'?'}章</div>`;
  }
  html+=`<div class="muted">权重(出现章数): <b>${n.weight||1}</b> · ${weightBar(n.weight||1)}</div>`;
  html+=`<div style="margin-top:8px"><b>出现章节:</b> `;
  (n.chapters||[]).forEach(c=>html+=`<span class="tag">第${c}章</span>`);
  if(!(n.chapters||[]).length) html+=`<span class="muted">（无章节记录）</span>`;
  html+=`</div>`;
  if(n.kind==='char'&&n['关键事件']&&n['关键事件'].length){
    html+=`<div style="margin-top:10px"><b>关键事件</b></div>`;
    n['关键事件'].forEach(ev=>html+=`<div class="ev">${ev}</div>`);
  }
  const rels=[];
  DATA.edges.forEach(e=>{
    let o=null;
    if(e.from===id) o=DATA.nodeById[e.to];
    if(e.to===id) o=DATA.nodeById[e.from];
    if(o) rels.push({name:o.name,label:e.label||e.kind,kind:o.kind});
  });
  if(rels.length){
    html+=`<div style="margin-top:10px"><b>关联</b> (${rels.length})</div>`;
    rels.slice(0,25).forEach(r=>{
      html+=`<div class="ev">${r.kind==='char'?'👤':'🏷️'} <b>${r.name}</b> ${r.label? '— '+r.label:''} <span class="muted" style="cursor:pointer" data-jump="${r.name}">→</span></div>`;
    });
  }
  side.innerHTML=html;
  side.querySelectorAll('[data-jump]').forEach(el=>{
    el.onclick=()=>{
      const nm=el.getAttribute('data-jump');
      const target=DATA.nodes.find(x=>(x.name===nm||(x.aliases||[]).includes(nm)));
      if(target) showDetail(target.id);
    };
  });
}

// 视图切换
function setView(v){
  view=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  document.getElementById('viewSel').value=v;
  activeNodeId=null;
  syncTypeFilterVisibility();
  applyFilter();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setView(t.dataset.view));
document.getElementById('viewSel').onchange=e=>setView(e.target.value);

window.addEventListener('resize',()=>{ if(sim) applyFilter(); });
</script>
</body>
</html>
