<script>
const DETAIL=__DETAIL_DATA__;
const GRAPH=__GRAPH_DATA__;
const PERSONALITY=__PERSONALITY_DATA__;
const FEELINGS=__FEELINGS_DATA__;
const CLUE=__CLUE_GRAPH__;
const STYLE=__STYLE_DATA__;
const SCENES_META=__SCENES_META__||[];
const FORESHADOW=__FORESHADOW__||[];
const SCENE_ANNOT=__SCENE_ANNOTATIONS__||[];
const REVIEWS=__EDITOR_REVIEWS__||{};
const RESUMES=__RESUMES_DATA__||[];
const SETTINGS=__SETTINGS_SYSTEM__;
const SG=__SETTINGS_GRAPH__||{terms:[],relations:[]};
const CF=__CHAR_FACTS__||{};
const EREG=__ENTITY_REG__||{};
const LEXICON=__GENERIC_LEXICON__||{};
window.__STYLE_BL__=__STYLE_BL_OBJ__;
const WN=__WEBNOVEL_LEXICON__||{};
const WNSUG=__WN_SUGGEST__||[];
/* 短期条目弱化: 只出现在少数几章/场景的设定, 视觉上降权(灰化+标注), 但不删除 */
function isEphemeral(t){
  const fs=t.first_seen, ls=t.last_seen, sc=(t.source_scenes||[]).length;
  if(fs!=null && ls!=null) return (ls-fs)<=2;
  return sc<=2;
}
function spanText(t){
  const fs=t.first_seen, ls=t.last_seen, sc=(t.source_scenes||[]).length;
  if(fs!=null&&ls!=null&&ls!==fs) return '第 '+fs+'–'+ls+' 章 · '+sc+' 个场景';
  if(fs!=null) return '第 '+fs+' 章 · '+sc+' 个场景';
  return sc+' 个场景';
}

const NOVEL="__NOVEL_NAME__";

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* 数据来源徽章 —— 所有字段必须标清是原文抽/LLM推/统计聚合, 抑制幻觉 */
const SRC={
  R:'<span class="src-badge src-r" title="来自原文逐字抽取（未由本面板生成）">原文抽取</span>',
  L:'<span class="src-badge src-l" title="由 LLM 推断总结，存在幻觉风险，建议复核">LLM 推断</span>',
  S:'<span class="src-badge src-s" title="由规则统计聚合">统计聚合</span>',
  M:'<span class="src-badge src-m" title="混合来源">混合</span>',
  G:'<span class="src-badge" style="background:#eef2f5;color:#54595d" title="来自场景抽取数据">场景数据</span>'
};

/* ============ 索引构建 ============ */
const CHARS={};      // 人物名 -> resume
const CHAR_LIST=[];  // 按出场次数降序
RESUMES.forEach(r=>{ if(!r||!r.name)return; CHARS[r.name]=r; CHAR_LIST.push(r); });
CHAR_LIST.sort((a,b)=>((b.appearances||[]).length)-((a.appearances||[]).length));

const TERMS={};      // 设定名 -> term
const TERM_LIST=[];
(SG.terms||[]).forEach(t=>{ if(!t||!t.name)return; TERMS[t.name]=t; TERM_LIST.push(t); });

// 别名 -> 规范名
const ALIAS={};
Object.keys(EREG).forEach(k=>{
  const e=EREG[k]; (e.aliases||[]).forEach(a=>{ if(a&&a!==e.canonical) ALIAS[a]=e.canonical; });
});
(SG.terms||[]).forEach(t=>{ (t.aliases||[]).forEach(a=>{ if(a&&a!==t.name) ALIAS[a]=t.name; }); });
function canon(n){ return ALIAS[n]||n; }

/* ============ 词条权重(解决"整合度高的词条排前面") ============
   weight = 40·log10(1+暗线命中) + 25·log10(1+场景数) + 20·log10(1+关系度) + 15·被结论引用
   分级: S≥60 核心 / A 35-60 重要 / B 15-35 一般 / C<15 边缘(侧栏折叠) */
const CLUE_OCC={};   // 暗线实体出现次数
(CLUE.entities||[]).forEach(e=>{CLUE_OCC[e.name]=e.occurrence||0;});
const DEG={};        // 关系度 = relations + related
(SG.relations||[]).forEach(r=>{DEG[r.from]=(DEG[r.from]||0)+1;DEG[r.to]=(DEG[r.to]||0)+1;});
const CONCL_TEXT=(CLUE.conclusions||[]).map(c=>(c.fact||'')+' '+(c.reason||'')+' '+(c.hypothesis||'')).join(' ');
function termWeight(t){
  const n=t.name;
  let d=DEG[n]||0; (t.related||[]).forEach(()=>{d++;});
  // 返回原始分(不封顶, 保证排序区分度); 显示时用 fmtW 封顶到 100
  const raw=40*Math.log10(1+(CLUE_OCC[n]||0))
          +25*Math.log10(1+((t.source_scenes||[]).length))
          +20*Math.log10(1+d)
          +(CONCL_TEXT.indexOf(n)>=0?15:0);
  return Math.round(raw*10)/10;
}
function fmtW(w){return Math.min(100,w);}
function lvlOf(w){return w>=60?'S':(w>=35?'A':(w>=15?'B':'C'));}
function lvlBadge(w){const l=lvlOf(w);return '<span class="lvl-badge lvl-'+l.toLowerCase()+'" title="整合度权重 '+w+'（暗线命中/场景覆盖/关系度/结论引用 综合）">'+l+'</span>';}
function lvlDot(w){const l=lvlOf(w);const c={S:'#d4a017',A:'#3366cc',B:'#a2a9b1',C:'#eaecf0'}[l];
  return l==='C'?'':'<span class="lvl-dot" style="background:'+c+'"></span>';}
// 全站权重表 + 排名
const TW={}, TRANK={};
TERM_LIST.forEach(t=>{TW[t.name]=termWeight(t);});
TERM_LIST.slice().sort((a,b)=>TW[b.name]-TW[a.name]).forEach((t,i)=>{TRANK[t.name]=i+1;});
// 人物权重(同一公式, 场景数用 appearances 长度)
function charWeight(c){
  const n=c.name;
  const raw=40*Math.log10(1+(CLUE_OCC[n]||0))
          +25*Math.log10(1+((c.appearances||[]).length))
          +20*Math.log10(1+(c.relations||[]).length)
          +(CONCL_TEXT.indexOf(n)>=0?15:0);
  return Math.round(raw*10)/10;
}
CHAR_LIST.forEach(c=>{c._w=charWeight(c);});

/* ============ 通用名词判定 ============
   词库来自公版资产 src/generic_lexicon.json(经 cli 注入 __GENERIC_LEXICON__),
   与 pipeline 抽取过滤(setting_agent.convolve_settings)共用同一份文件, 跨书共享:
   A 书沉淀的新通用词, B 书直接受益。只标灰不删数据。 */
const LEX=__GENERIC_LEXICON__||{categories:{},patterns:[],protected:{prefixes:[]}};
const GENERIC_SET=new Set(Object.values(LEX.categories||{}).reduce((a,b)=>a.concat(b||[]),[]));
const GENERIC_PAT=(LEX.patterns||[]).map(p=>{try{return new RegExp(p);}catch(e){return null;}}).filter(Boolean);
const GENERIC_PROT=(LEX.protected&&LEX.protected.prefixes)||[];
function isGeneric(name, def){
  const n=(name||'').trim();
  if(!n) return true;
  for(const pre of GENERIC_PROT){ if(n.startsWith(pre)) return false; }  // 《》【】包裹=专有
  if(GENERIC_SET.has(n)) return true;      // 词典精确匹配
  for(const re of GENERIC_PAT){ if(re.test(n)) return true; }  // S级xxx / 2000分 / 纯数字
  return false;
}
const GENERIC_INFO={};  // name -> true
TERM_LIST.forEach(t=>{ if(isGeneric(t.name,t.definition)) GENERIC_INFO[t.name]=true; });
const GENERIC_COUNT=Object.keys(GENERIC_INFO).length;
let showGeneric=false;   // 侧栏默认: 仅本书设定


// 内链词典: name -> 'char' | 'term'
const LTYPE={};
Object.keys(CHARS).forEach(n=>LTYPE[n]='char');
Object.keys(CF).forEach(n=>{ const c=canon(n); if(c&&!LTYPE[c]) LTYPE[c]='char'; });
Object.keys(TERMS).forEach(n=>{ if(!LTYPE[n]) LTYPE[n]='term'; });
const LNAMES=Object.keys(LTYPE).filter(n=>n&&n.length>=2).sort((a,b)=>b.length-a.length);
let LRE=null;
try{
  LRE=new RegExp('('+LNAMES.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
}catch(e){ LRE=null; }
function wl(text){
  let s=esc(text);
  if(!LRE||!s) return s;
  LRE.lastIndex=0;
  return s.replace(LRE,m=>(LTYPE[m]?'<a class="wl" data-t="'+LTYPE[m]+'" data-n="'+esc(m)+'">'+m+'</a>':m));
}

  const apps=r.appearances||facts.appearances||[];
  const chs={}; apps.forEach(a=>{ const c=a[0]; chs[c]=(chs[c]||0)+1; });
  const chKeys=Object.keys(chs).map(Number).sort((a,b)=>a-b);
  const first=chKeys[0]||'?', last=chKeys[chKeys.length-1]||'?';
  const dims=PERSONALITY[name]||{};
  const alias=(EREG[name]||{}).aliases||[];
  const rels=r.relations||[];
  const co=facts.co_occurrences||{};
  const coTop=Object.keys(co).sort((a,b)=>co[b]-co[a]).slice(0,12);
  const say=(facts.sayings||[]).slice(0,8);
  const doings=(facts.doings||[]).slice(0,6);

  // Infobox
  let ib='<div class="infobox"><div class="ib-h">'+esc(name)+
    '<div class="sub">'+esc(r.identity||'身份未明示')+'</div></div>'+

    '<table>';
  ib+=row('权重',lvlBadge(r._w)+SRC.S+fmtW(r._w)+' 分');
  if(alias.length) ib+=row('别名',SRC.R+alias.map(esc).join('、'));
  ib+=row('首次出现',SRC.S+'第 '+first+' 章');
  ib+=row('最后出现',SRC.S+'第 '+last+' 章');
  ib+=row('出场场景',SRC.S+apps.length+' 次 / '+chKeys.length+' 章');
  if(r.personality) ib+=row('性格',SRC.L+esc(r.personality));
  if(rels.length) ib+=row('关联人物',SRC.L+rels.slice(0,6).map(x=>{
      return CHARS[x.name]?'<a class="wl" data-t="char" data-n="'+esc(x.name)+'">'+esc(x.name)+'</a>':esc(x.name);
    }).join('、'));
  ib+='</table>';
  if(dims&&Object.keys(dims).length){
    ib+='<div class="ib-note">性格六维（LLM）: '+Object.keys(dims).map(k=>esc(k)+' '+dims[k]).join(' · ')+'</div>';
  }
  ib+='</div>';

  let h=crumb('人物',name)+'<h1 class="art">'+esc(name)+'<span class="cat-badge">人物</span></h1>';

  // 出场时间线

function viewTerm(name){
  const t=TERMS[name];
  if(!t) return crumb('设定')+'<div class="muted">未找到该设定。</div>';

  // 合并两类关系: SG.relations(关系聚合) + terms[].related(LLM 显式关联)
  const rSet={};  // key = other|type
  (SG.relations||[]).filter(r=>r.from===name||r.to===name).forEach(r=>{
    const out=r.from===name, other=out?r.to:r.from;
    const key=other+'|'+(r.type||'关联');

  h+='<div class="subtitle">'+esc(t.category||'')+' · 首次出现于第 '+(t.first_seen||'?')+' 章</div>';

       '，通常是一次性道具/临时场景，非贯穿全书的核心设定（展示已弱化）。</div>';

      '<div class="card info"><ul class="tight">'+
      rels.map(r=>{
        const link=TERMS[r.other]?'<a class="wl" data-t="term" data-n="'+esc(r.other)+'">'+esc(r.other)+'</a>':esc(r.other);

let plotDense='rep';          // rep=每章代表场景 | all=全部
let plotChRange=null;         // [from,to] 章节筛选
let canvasState={x:28,y:14,s:1};
function pickScenes(){
  let scenes=SCENES_META;
  if(plotChRange){ scenes=scenes.filter(s=>s.chapter_no>=plotChRange[0]&&s.chapter_no<=plotChRange[1]); }
  if(plotDense==='all') return scenes;
  const byCh={};
  scenes.forEach(s=>{ (byCh[s.chapter_no]=byCh[s.chapter_no]||[]).push(s); });
  const conclCh=new Set((CLUE.conclusions||[]).map(c=>Number(c.chapter_no)));
  const out=[];
  Object.keys(byCh).sort((a,b)=>+a-+b).forEach(ch=>{
    const arr=byCh[ch].slice().sort((a,b)=>(b.n_ev||0)-(a.n_ev||0));
    let picked=arr.filter(s=>conclCh.has(+ch)).slice(0,2);
    arr.forEach(s=>{ if(picked.length<3 && !picked.includes(s)) picked.push(s); });
    if(picked.length<3 && arr.length>2){
      const sorted=arr.slice().sort((a,b)=>Math.abs(b.sentiment||0)-Math.abs(a.sentiment||0));
      if(!picked.includes(sorted[0])) picked.push(sorted[0]);
    }
    picked.slice(0,3).forEach(s=>out.push(s));
  });
  return out;
}
function renderCanvas(){
  const stage=document.getElementById('canvasStage'); if(!stage) return;
  const scenes=pickScenes();
  const CARD_W=232,GAP=14,CARD_H=150;

  (CLUE.conclusions||[]).forEach(c=>{ const k=Number(c.chapter_no); (conclByCh[k]=conclByCh[k]||[]).push(c); });
  let x=0, html='';
  scenes.forEach(s=>{
    const emo=s.sentiment||0;
    const bar=emo>=0.15?'#12B5C4':(emo<=-0.15?'#FF7A45':'#c8ccd1');
    const who=(s.who||[]).map(w=>w.name||w).slice(0,3).join('、');
    const key=String(s.raw_text||'').replace(/\s+/g,' ').slice(0,46);
    const ann=SCENE_ANNOT.find(a=>String(a.scene_id)===String(s.scene_id));
    html+='<div class="shot-card" style="left:'+x+'px;top:8px;border-top:3px solid '+bar+'" data-sid="'+esc(String(s.scene_id))+'">'
      +(ann?'<span class="badge" style="background:#8e44ad;color:#fff;float:right;cursor:help" title="'+esc(ann.note||'')+'">🎬 '+esc(ann.plot_function||'')+'</span>':'')
      +'<div class="sc-hd"><span class="cat-badge" style="background:#eef2f5;color:#54595d">第'+s.chapter_no+'章·s'+s.scene_id+'</span>'
      +(s.n_ev?'<span class="badge" style="background:#0A7E8C;color:#fff;float:right">🕸'+s.n_ev+'</span>':'')+'</div>'
      +'<div class="sc-where">📍 '+esc(s.where||'?')+'</div>'
      +'<div class="sc-who">'+esc(who||'—')+'</div>'
      +'<div class="sc-key">'+esc(key)+'</div></div>';
    (conclByCh[s.chapter_no]||[]).slice(0,1).forEach(c=>{
      html+='<div class="concl-card" style="left:'+x+'px;top:'+(CARD_H+24)+'px" data-cid="'+esc(c.id)+'">'
        +'<div class="sc-hd"><span class="badge" style="background:#d33">推理</span> 第'+c.chapter_no+'章</div>'
        +'<div class="sc-key" style="font-weight:600">'+esc(String(c.fact||'').slice(0,64))+'</div></div>';
    });
    x+=CARD_W+GAP;
  });
  stage.innerHTML=html;
  stage.style.width=Math.max((x+60)+'px','100%');
  applyCanvas();
  bindCanvas();
}
function applyCanvas(){
  const s=document.getElementById('canvasStage');
  if(s) s.style.transform='translate('+canvasState.x+'px,'+canvasState.y+'px) scale('+canvasState.s+')';
}
function canvasZoom(f){
  const ns=Math.min(2.2,Math.max(0.25,canvasState.s*f));
  const w=document.getElementById('canvasWrap');
  if(w){ const r=w.getBoundingClientRect(), px=r.width/2, py=r.height/2;
    canvasState.x=px-(px-canvasState.x)*(ns/canvasState.s);
    canvasState.y=py-(py-canvasState.y)*(ns/canvasState.s); }
  canvasState.s=ns; applyCanvas();
}
function canvasReset(){ canvasState={x:28,y:14,s:1}; applyCanvas(); }
function setDense(mode){

/* 画布交互: 拖拽/缩放/触屏 */
let canvasDrag=null;
function bindCanvas(){
  const w=document.getElementById('canvasWrap'); if(!w||w.dataset.bound) return;
  w.dataset.bound='1';
  w.style.cursor='grab';
  w.onwheel=e=>{
    e.preventDefault();
    const r=w.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
    const f=e.deltaY<0?1.1:1/1.1;
    const ns=Math.min(2.2,Math.max(0.25,canvasState.s*f));
    canvasState.x=px-(px-canvasState.x)*(ns/canvasState.s);
    canvasState.y=py-(py-canvasState.y)*(ns/canvasState.s);
    canvasState.s=ns; applyCanvas();
  };
  w.onmousedown=e=>{ canvasDrag={x:e.clientX,y:e.clientY}; w.style.cursor='grabbing'; };
  window.onmousemove=e=>{ if(canvasDrag){ canvasState.x+=e.clientX-canvasDrag.x; canvasState.y+=e.clientY-canvasDrag.y; canvasDrag={x:e.clientX,y:e.clientY}; applyCanvas(); } };
  window.onmouseup=()=>{ canvasDrag=null; if(w) w.style.cursor='grab'; };
  w.ondblclick=()=>canvasReset();
  w.addEventListener('touchstart',e=>{ if(e.touches.length===1) canvasDrag={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
  w.addEventListener('touchmove',e=>{ if(canvasDrag&&e.touches.length===1){ canvasState.x+=e.touches[0].clientX-canvasDrag.x; canvasState.y+=e.touches[0].clientY-canvasDrag.y; canvasDrag={x:e.touches[0].clientX,y:e.touches[0].clientY}; applyCanvas(); } },{passive:true});
  w.addEventListener('touchend',()=>{ canvasDrag=null; },{passive:true});
  w.addEventListener('click',e=>{
    const sc=e.target.closest?e.target.closest('.shot-card'):null;
    if(sc){ shotDetail(sc); return; }
    const cc=e.target.closest?e.target.closest('.concl-card'):null;
    if(cc){ conclDetail(cc); }
  });
}

function drawSettingGraph(focus){
  const svg=document.getElementById('sgSvg');
  if(!svg)return;
  let nodes,edges;
  if(focus){
    // 局部: 焦点 + 一跳邻居
    const nb=new Set([focus]);
    (SG.relations||[]).forEach(r=>{ if(r.from===focus)nb.add(r.to); if(r.to===focus)nb.add(r.from); });
    nodes=[...nb].filter(n=>TERMS[n]).map(n=>({id:n,cat:(TERMS[n].category||''),name:n}));
    edges=(SG.relations||[]).filter(r=>r.from===focus||r.to===focus)
      .filter(r=>nb.has(r.from)&&nb.has(r.to))
      .map(r=>({a:r.from,b:r.to,type:r.type||'',how:r.how||''}));
  }else{
    // 全局: 取关联度 top N
    const deg={};
    (SG.relations||[]).forEach(r=>{deg[r.from]=(deg[r.from]||0)+1;deg[r.to]=(deg[r.to]||0)+1;});
    const sel=document.getElementById('sgCat');
    const cat=sel?sel.value:'';
    const cand=TERM_LIST.filter(t=>!cat||(t.category||'')===cat)
      .sort((a,b)=>(deg[b.name]||0)-(deg[a.name]||0)).slice(0,70);
    const ids=new Set(cand.map(t=>t.name));
    nodes=cand.map(t=>({id:t.name,cat:(t.category||''),name:t.name,r:isEphemeral(t)?5:8}));
    edges=(SG.relations||[]).filter(r=>ids.has(r.from)&&ids.has(r.to))
      .map(r=>({a:r.from,b:r.to,type:r.type||'',how:r.how||''}));
    // 图例
    const lg=document.getElementById('sgLegend');
    if(lg){
      const cats={}; nodes.forEach(n=>cats[n.cat]=(cats[n.cat]||0)+1);
      lg.innerHTML=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).slice(0,8)
        .map(c=>'<span><span class="dot" style="background:'+catColor(c)+'"></span>'+esc(c)+'</span>').join('');
    }
    if(sel) sel.onchange=()=>drawSettingGraph('');
  }
  forceLayout(svg,nodes,edges,{focus:focus,radius:8,labelSize:10});
}

function drawClueGraph(){

  const nodes=[],edges=[];
  (CLUE.conclusions||[]).forEach(c=>nodes.push({id:c.id,cat:'结论',name:'结论'+(c.id||''),kind:'concl',r:9}));
  (CLUE.clusters||[]).forEach(c=>nodes.push({id:c.id,cat:'簇',name:c.id,kind:'cluster',r:6+(c.weight||1)}));
  (CLUE.evidence||[]).slice(0,120).forEach(e=>nodes.push({id:e.id,cat:'证据',name:(e.text||'').slice(0,8),kind:'ev',r:4}));
  (CLUE.conclusions||[]).forEach(c=>{
    if(CL_MAP[c.cluster_id])edges.push({a:c.id,b:CL_MAP[c.cluster_id].id});
    (c.evidence_ids||[]).forEach(eid=>{if(EV_MAP[eid])edges.push({a:eid,b:c.id});});
  });
  (CLUE.clusters||[]).forEach(c=>(c.member_ids||[]).forEach(eid=>{if(EV_MAP[eid])edges.push({a:eid,b:c.id});}));
  forceLayout(svg,nodes,edges,{radius:0,labelSize:9,
    colorOf:n=>({结论:'#d33',簇:'#fc3',证据:'#00af89'})[n.cat]||'#7f8c8d'});
}

/* 通用力导向布局 —— 用 createElementNS 保证 SVG 命名空间正确 */
function forceLayout(svg,nodes,edges,opt){
  opt=opt||{};
  const W=svg.clientWidth||900,H=svg.clientHeight||440;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  if(!nodes.length){
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',W/2);t.setAttribute('y',H/2);t.setAttribute('text-anchor','middle');
    t.setAttribute('fill','#72777d');t.setAttribute('font-size','13');t.textContent='（暂无可绘制的节点）';
    svg.appendChild(t);return;
  }
  const NS='http://www.w3.org/2000/svg';
  const map={};nodes.forEach(n=>map[n.id]=n);
  edges=edges.filter(e=>map[e.a]&&map[e.b]);
  // focus 必须先声明再使用: 下方 nodes.forEach 内会引用它,
  // 若声明在其后会触发 TDZ (Cannot access 'focus' before initialization)。
  const focus=opt.focus;
  nodes.forEach((n,i)=>{
    const a=(i/nodes.length)*Math.PI*2;
    n.x=W/2+Math.cos(a)*(focus?90:160)+Math.random()*40;
    n.y=H/2+Math.sin(a)*(focus?70:130)+Math.random()*40;
    n.vx=0;n.vy=0;
  });
  const iters=nodes.length>200?80:140;
  for(let it=0;it<iters;it++){
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;
        if(d2<1){d2=1;dx=Math.random()-.5;dy=Math.random()-.5;}
        const f=(nodes.length>150?500:900)/d2, d=Math.sqrt(d2);
        a.vx+=dx/d*f*0.008;a.vy+=dy/d*f*0.008;b.vx-=dx/d*f*0.008;b.vy-=dy/d*f*0.008;
      }
    }
    edges.forEach(e=>{
      const a=map[e.a],b=map[e.b];
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      const f=(d-(focus?80:70))*0.02;
      a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f;
    });
    nodes.forEach(n=>{
      n.x+=n.vx;n.y+=n.vy;n.vx*=0.85;n.vy*=0.85;
      n.x=Math.max(30,Math.min(W-30,n.x));n.y=Math.max(20,Math.min(H-24,n.y));
    });
  }
  const colorOf=opt.colorOf||(n=>catColor(n.cat));
  const gE=document.createElementNS(NS,'g');
  edges.forEach(e=>{
    const a=map[e.a],b=map[e.b];
    const ln=document.createElementNS(NS,'line');
    ln.setAttribute('x1',a.x.toFixed(1));ln.setAttribute('y1',a.y.toFixed(1));
    ln.setAttribute('x2',b.x.toFixed(1));ln.setAttribute('y2',b.y.toFixed(1));
    ln.setAttribute('stroke','#c8ccd1');ln.setAttribute('stroke-width','1');
    ln.dataset.a=e.a;ln.dataset.b=e.b;
    gE.appendChild(ln);
  });
  svg.appendChild(gE);
  const gN=document.createElementNS(NS,'g');
  nodes.forEach(n=>{
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','nd');g.dataset.id=n.id;
    const r=(focus&&n.id===focus)?13:(opt.r?Math.max(opt.r,n.r||4):(n.r||(opt.radius||8)));
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',n.x.toFixed(1));c.setAttribute('cy',n.y.toFixed(1));c.setAttribute('r',r);
    c.setAttribute('fill',colorOf(n));c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','1.6');
    g.appendChild(c);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',n.x.toFixed(1));t.setAttribute('y',(n.y+r+11).toFixed(1));
    t.setAttribute('text-anchor','middle');t.setAttribute('font-size',opt.labelSize||10);
    t.setAttribute('fill','#54595d');t.textContent=n.name;
    g.appendChild(t);
    g.style.cursor='pointer';
    g.addEventListener('mouseenter',()=>{
      const nb=new Set([n.id]);
      edges.forEach(e=>{if(e.a===n.id)nb.add(e.b);if(e.b===n.id)nb.add(e.a);});
      svg.querySelectorAll('.nd').forEach(x=>x.style.opacity=nb.has(x.dataset.id)?1:0.12);
      svg.querySelectorAll('line').forEach(l=>{
        const hl=(l.dataset.a===n.id||l.dataset.b===n.id);
        l.setAttribute('stroke',hl?'#d33':'#eaecf0');l.setAttribute('stroke-width',hl?'1.8':'1');
      });
    });
    g.addEventListener('mouseleave',()=>{
      svg.querySelectorAll('.nd').forEach(x=>x.style.opacity=1);
      svg.querySelectorAll('line').forEach(l=>{l.setAttribute('stroke','#c8ccd1');l.setAttribute('stroke-width','1');});
    });
    g.addEventListener('click',()=>{
      if(TERMS[n.id]) go('term',n.id);
      else if(CHARS[n.id]) go('char',n.id);
    });
    gN.appendChild(g);
  });
  svg.appendChild(gN);
}

/* 局部小图 —— 用于 Infobox 内展示词条/人物的一跳关系 */
function drawMiniGraph(focusName){
  const svg=document.getElementById('miniSvg');
  if(!svg||!focusName||!TERMS[focusName]) return;
  const nb=new Set([focusName]);
  const edges=[];
  (SG.relations||[]).forEach(r=>{
    if(r.from===focusName){ nb.add(r.to); edges.push({a:r.from,b:r.to}); }
    else if(r.to===focusName){ nb.add(r.from); edges.push({a:r.from,b:r.to}); }
  });
  const t=TERMS[focusName];
  (t.related||[]).forEach(rr=>{ if(TERMS[rr.to]){ nb.add(rr.to); edges.push({a:focusName,b:rr.to}); } });
  const nodes=[...nb].filter(n=>TERMS[n]).map(n=>({id:n,cat:TERMS[n].category||'',name:n,focus:n===focusName,r:n===focusName?10:5}));
  // 如果只有中心点, 也显示一个节点
  forceLayout(svg,nodes,edges,{focus:focusName,labelSize:9});
}



/* ============ 搜索 ============ */
const IDX=[];
CHAR_LIST.forEach(c=>IDX.push({t:'char',n:c.name,k:c.name+' '+(c.identity||'')+' '+(c.personality||'')}));
TERM_LIST.forEach(t=>IDX.push({t:'term',n:t.name,k:t.name+' '+(t.aliases||[]).join(' ')+' '+(t.definition||'')}));
Object.keys(CF).forEach(n=>{
  (CF[n].sayings||[]).slice(0,3).forEach(s=>IDX.push({t:'char',n:canon(n),k:s,q:s}));
});
const q=document.getElementById('q'), sug=document.getElementById('sug');
const TN={char:'人物',term:'设定'};
q.addEventListener('input',()=>{
  const v=q.value.trim();
  if(!v){sug.classList.remove('on');sug.innerHTML='';return;}
  const low=v.toLowerCase();
  const hit=IDX.filter(x=>x.k.toLowerCase().indexOf(low)>=0).slice(0,40);
  if(!hit.length){sug.innerHTML='<div class="muted" style="cursor:default">无匹配结果</div>';sug.classList.add('on');return;}
  sug.innerHTML=hit.map((x,i)=>'<div data-i="'+i+'" data-t="'+x.t+'" data-n="'+esc(x.n)+'">'+
    (x.q?'<span class="t">语录</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.q.slice(0,50))+'</span>'
        :'<span class="t">'+TN[x.t]+'</span><b>'+esc(x.n)+'</b>')+'</div>').join('');
  sug.classList.add('on');
  sug.querySelectorAll('div[data-i]').forEach(d=>{
    d.onclick=()=>{ q.value=''; sug.classList.remove('on'); go(d.dataset.t,d.dataset.n); };
  });
});
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const f=sug.querySelector('div[data-i]');
    if(f){ q.value=''; sug.classList.remove('on'); go(f.dataset.t,f.dataset.n); }
  }else if(e.key==='Escape'){ sug.classList.remove('on'); }
});
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) sug.classList.remove('on'); });

document.getElementById('topcnt').textContent=
  CHAR_LIST.length+' 人物 · '+TERM_LIST.length+' 设定 · '+(SG.relations||[]).length+' 关系';
go('overview');

    else if(CUR.view==='overview'||CUR.view==='term')drawSettingGraph(CUR.view==='term'?CUR.name:'');
